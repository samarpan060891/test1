server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    resolver 8.8.8.8 valid=30s;

    location /api/ {
        proxy_pass https://test1-production-6593.up.railway.app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host test1-production-6593.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    # Never cache index.html so users always get the latest app
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Vite JS/CSS assets have hashed filenames — safe to cache long-term
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
