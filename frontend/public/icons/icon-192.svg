<svg xmlns='http://www.w3.org/2000/svg' width='192' height='192' viewBox='0 0 192 192'>
  <!-- Brand dark brown background -->
  <rect width='192' height='192' rx='38' fill='#1C1208'/>
  <!-- Dark maroon circle (brand badge) -->
