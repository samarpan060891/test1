<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'>
  <!-- Brand dark brown background -->
  <rect width='512' height='512' rx='100' fill='#1C1208'/>
  <!-- Dark maroon circle centred -->
  <circle cx='256' cy='256' r='182' fill='#6B1A1A'/>
  <!-- Lowercase serif r in brand orange -->
  <text x='256' y='342' font-family='Georgia,Times New Roman,serif' font-size='236' font-weight='700' fill='#E8470F' text-anchor='middle' dominant-baseline='auto'>r</text>
  <!-- 'ip' superscript top-right of circle -->
  <text x='406' y='122' font-family='Arial,sans-serif' font-size='64' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='auto'>ip</text>
</svg>
