<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'>
  <!-- Brand dark brown background -->
  <rect width='512' height='512' rx='100' fill='#1C1208'/>
  <!-- Dark maroon circle (brand badge) -->
  <circle cx='218' cy='256' r='165' fill='#6B1A1A'/>
  <!-- Lowercase serif r in brand orange inside circle -->
  <text x='218' y='328' font-family='Georgia,Times New Roman,serif' font-size='214' font-weight='700' fill='#E8470F' text-anchor='middle' dominant-baseline='auto'>r</text>
  <!-- small white 'ip' to the right -->
  <text x='406' y='288' font-family='Arial,sans-serif' font-size='80' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='auto'>ip</text>
</svg>
